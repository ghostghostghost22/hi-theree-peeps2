[package]
name = "rustbox-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true

[dependencies]
rustbox-core.workspace = true
rustbox-cpu.workspace = true
rustbox-memory.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Keep these paired: kvm-ioctls 0.19 uses the kvm-bindings 0.10 API and
# preserves the workspace's Rust 1.75 minimum while the backend stabilizes.
kvm-bindings = "0.10"
kvm-ioctls = "0.19"
